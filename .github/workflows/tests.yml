name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same Home Assistant the integration is deployed on.
          - label: "HA 2026.8.3"
            phacc: "0.13.357"
            experimental: false
          # Early warning for the next release; failures here do not block.
          - label: "HA 2026.9 beta"
            phacc: "0.13.361"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component requires >=3.14
          python-version: "3.14"
          cache: pip

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}"
          python -c "import homeassistant; from importlib.metadata import version; print('homeassistant', version('homeassistant'))"

      - name: Compile
        run: python -m compileall -q custom_components/miwifi

      - name: Pytest
        run: pytest -q --cov=custom_components/miwifi --cov-report=term-missing
